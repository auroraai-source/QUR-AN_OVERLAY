<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qur'an Overlay Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981; 
            --primary-dark: #059669; 
            --accent: #ec4899; 
            --surface: #ffffff;
            --background: #ecfdf5; 
            --text: #1f2937;
            --text-secondary: #4b5563;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: var(--text);
            overflow: hidden; 
            touch-action: manipulation;
        }

        .arabic-text {
            font-family: 'Amiri Quran', serif;
            direction: rtl;
        }

        @media (min-width: 640px) {
            .phone-frame {
                border-radius: 48px;
                border: 14px solid #10b981; 
                height: 90vh;
                max-height: 860px;
                background-color: var(--background); 
                box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6); 
                position: relative;
                overflow: hidden; 
                display: flex;
                flex-direction: column;
            }
        }
        
        @media (max-width: 639px) {
            .phone-frame {
                width: 100vw;
                height: 100dvh;
                background-color: var(--background);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
        }

        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            background-color: #0b0f19;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-track { background: transparent; }
        .overflow-y-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .overflow-y-auto::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .toggle-checkbox:checked { right: 0; border-color: var(--primary); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--primary); }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }

        #overlay-content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex items-center justify-center">

    <div class="phone-frame w-full max-w-[400px]">
        
        <!-- App Top Bar -->
        <div class="px-6 pt-10 pb-4 bg-white shadow-sm z-10 sticky top-0">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-gray-800 leading-tight">Qur'an Overlay</h1>
                        <p class="text-[10px] text-emerald-500 font-medium">Mobile Video Studio</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-preview-audio" class="p-2 rounded-lg bg-emerald-500 text-white hover:bg-emerald-600 transition-colors flex items-center gap-1 shadow-md shadow-emerald-500/30 text-xs font-semibold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                        Tes Suara
                    </button>
                    <button id="btn-export" class="p-2 rounded-lg bg-pink-500 text-white hover:bg-pink-600 transition-colors flex items-center gap-1 shadow-md shadow-pink-500/30 text-xs font-semibold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Export
                    </button>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="flex border-b border-gray-200 mt-4 relative">
                <button class="tab-btn flex-1 py-3 text-sm font-semibold text-emerald-600 border-b-2 border-emerald-500 transition-colors flex justify-center items-center gap-2" data-target="tab-surah">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Surah
                </button>
                <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors flex justify-center items-center gap-2" data-target="tab-studio">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Studio
                </button>
                <button class="tab-btn flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors flex justify-center items-center gap-2" data-target="tab-design">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                    Desain
                </button>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto px-6 py-4 relative z-0">
            
            <!-- TAB 1: DATA SURAH -->
            <div id="tab-surah" class="tab-content active space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h2 class="text-xs font-bold text-emerald-600 mb-4 uppercase tracking-wider flex items-center gap-2">
                        Pilih Surah & Ayat
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1 font-medium">Surah Al-Qur'an</label>
                            <select id="surah-select" class="w-full bg-pink-500/10 border border-pink-200 text-gray-800 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block p-3 outline-none transition-shadow">
                                <option value="">Memuat daftar Surah...</option>
                            </select>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1 font-medium">Dari Ayat</label>
                                <input type="number" id="ayat-start" min="1" value="1" class="w-full bg-pink-500/10 border border-pink-200 text-gray-800 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block p-3 outline-none transition-shadow">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1 font-medium">Sampai Ayat</label>
                                <input type="number" id="ayat-end" min="1" value="3" class="w-full bg-pink-500/10 border border-pink-200 text-gray-800 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block p-3 outline-none transition-shadow">
                            </div>
                        </div>

                        <div class="flex items-center pt-2">
                            <input id="include-bismillah" type="checkbox" checked class="w-4 h-4 text-emerald-500 bg-gray-100 border-gray-300 rounded focus:ring-emerald-500 focus:ring-2">
                            <label for="include-bismillah" class="ml-2 text-sm font-medium text-gray-700">Sertakan Basmalah di awal</label>
                        </div>

                        <button id="btn-load" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-xl transition-all active:scale-[0.98] mt-2 shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Muat Data Ayat
                        </button>
                    </div>
                </div>
                
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 mb-10">
                    <h2 class="text-xs font-bold text-pink-500 mb-4 uppercase tracking-wider flex items-center gap-2">
                        Audio & Qari
                    </h2>
                    <div>
                        <!-- Menggunakan Qari API yang valid -->
                        <select id="qari-select" class="w-full bg-pink-500/10 border border-pink-200 text-gray-800 text-sm rounded-xl focus:ring-pink-500 focus:border-pink-500 block p-3 outline-none">
                            <option value="ar.alafasy">Mishary Rashid Alafasy</option>
                            <option value="ar.abdurrahmaansudais">Abdurrahmaan As-Sudais</option>
                            <option value="ar.abdulbasitmurattal">Abdul Basit (Murattal)</option>
                            <option value="ar.husary">Mahmoud Khalil Al-Husary</option>
                            <option value="ar.minshawi">Mohamed Siddiq al-Minshawi</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TAB 2: STUDIO (CANVAS & PLAYER) -->
            <div id="tab-studio" class="tab-content">
                <div class="flex justify-center mb-6">
                    <div id="export-area" class="preview-container w-64 md:w-72 relative transition-all duration-300">
                        
                        <!-- Overlay Khusus saat Export berjalan -->
                        <div id="recording-indicator" class="absolute inset-0 bg-black/60 z-50 hidden flex-col items-center justify-center backdrop-blur-sm">
                            <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                            <span class="text-white text-xs font-bold animate-pulse text-center">🔴 MEREKAM VIDEO...<br>Jangan tutup layar ini</span>
                        </div>

                        <div id="overlay-content" class="absolute inset-0 flex flex-col justify-center px-4 py-8 pointer-events-none transition-all duration-300">
                            
                            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-white/70 text-center">
                                <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                <p class="text-sm">Belum ada ayat dimuat.<br>Pilih surah di tab pertama.</p>
                            </div>

                            <div id="quran-text-container" class="w-full h-full relative hidden">
                                <!-- Data ayat akan dimasukkan lewat JS ke sini -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center text-xs text-gray-500 mb-8 px-4 font-medium" id="status-info">
                    Sistem siap. Silakan muat ayat di tab Surah.
                </div>
            </div>

            <!-- TAB 3: DESIGN SETTINGS -->
            <div id="tab-design" class="tab-content space-y-6 mb-10">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h2 class="text-xs font-bold text-emerald-600 mb-4 uppercase tracking-wider">Background & Layout</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-2 font-medium">Tipe Latar Belakang</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button class="bg-emerald-50 border-2 border-transparent hover:border-emerald-300 text-emerald-700 py-2 rounded-lg text-sm font-medium" id="bg-green">Green Screen</button>
                                <button class="bg-black border-2 border-gray-600 text-white py-2 rounded-lg text-sm font-medium" id="bg-black">Hitam Pekat</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-2 font-medium mt-4">Posisi Teks (Vertikal)</label>
                            <input type="range" id="pos-y" min="0" max="100" value="50" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h2 class="text-xs font-bold text-emerald-600 mb-4 uppercase tracking-wider">Tampilan Teks</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-700">Tampilkan Terjemahan</span>
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle" id="toggle-terjemahan" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10"/>
                                <label for="toggle-terjemahan" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1 font-medium">Ukuran Teks Arab</label>
                            <input type="range" id="size-arab" min="16" max="60" value="28" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1 font-medium">Warna Teks Arab</label>
                            <div class="flex items-center gap-3">
                                <input type="color" id="color-arab" value="#facc15" class="h-10 w-16 p-1 rounded bg-gray-50 border border-gray-200 cursor-pointer">
                            </div>
                        </div>
                        <div class="pt-2 border-t border-gray-100">
                            <label class="block text-xs text-gray-500 mb-1 font-medium">Ukuran Terjemahan</label>
                            <input type="range" id="size-indo" min="10" max="30" value="14" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- End Scrollable Area -->

        <!-- Persistent Audio Player at Bottom -->
        <div class="bg-white border-t border-gray-100 px-6 py-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20">
            <audio id="audio-player" class="hidden" crossorigin="anonymous"></audio>
            
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-3 text-[10px] font-medium text-gray-500">
                    <span id="time-current">0:00</span>
                    <div class="flex-1 relative w-full h-2 bg-gray-200 rounded-full overflow-hidden cursor-pointer" id="progress-container">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-emerald-500 w-0 transition-all duration-100"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="text-xs font-semibold text-gray-800 truncate w-32" id="now-playing-text">
                        Audio belum dimuat
                    </div>
                    <div class="flex items-center justify-center gap-4">
                        <button id="btn-prev" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        
                        <button id="btn-play" class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center hover:bg-emerald-600 transition-transform active:scale-95 shadow-md shadow-emerald-500/40">
                            <svg id="icon-play" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            <svg id="icon-pause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                        
                        <button id="btn-next" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    <div class="w-32 flex justify-end"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentAyatData = [];
        let currentAudioList = [];
        let currentPlayingIndex = 0;
        let surahDataMap = {}; 
        const apiBaseUrl = "https://api.quran.gading.dev/surah";

        // Variabel untuk Perekaman Latar Belakang (Export)
        let isExporting = false;
        let mediaRecorder;
        let recordedChunks = [];
        let audioCtx, sourceNode, destNode;
        let exportAnimationFrame;
        
        // Kanvas Tersembunyi untuk merender Video (Resolusi 720x1280)
        const recordCanvas = document.createElement('canvas');
        recordCanvas.width = 720;
        recordCanvas.height = 1280;

        // Mendapatkan Elemen UI
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const surahSelect = document.getElementById('surah-select');
        const ayatStartInput = document.getElementById('ayat-start');
        const ayatEndInput = document.getElementById('ayat-end');
        const qariSelect = document.getElementById('qari-select');
        const btnLoad = document.getElementById('btn-load');
        const includeBismillahCheckbox = document.getElementById('include-bismillah');
        const quranTextContainer = document.getElementById('quran-text-container');
        const emptyState = document.getElementById('empty-state');
        const overlayContent = document.getElementById('overlay-content');
        const exportArea = document.getElementById('export-area');
        const recordingIndicator = document.getElementById('recording-indicator');
        const statusInfo = document.getElementById('status-info');

        const posYInput = document.getElementById('pos-y');
        const sizeArabInput = document.getElementById('size-arab');
        const sizeIndoInput = document.getElementById('size-indo');
        const colorArabInput = document.getElementById('color-arab');
        const toggleTerjemahan = document.getElementById('toggle-terjemahan');
        const bgGreenBtn = document.getElementById('bg-green');
        const bgBlackBtn = document.getElementById('bg-black');

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const nowPlayingText = document.getElementById('now-playing-text');
        
        const btnPreviewAudio = document.getElementById('btn-preview-audio');
        const btnExport = document.getElementById('btn-export');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('text-emerald-600', 'border-emerald-500');
                    b.classList.add('text-gray-500', 'border-transparent');
                    b.style.borderBottomWidth = "2px"; 
                });
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.remove('text-gray-500', 'border-transparent');
                btn.classList.add('text-emerald-600', 'border-emerald-500');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        async function fetchSurahList() {
            try {
                const response = await fetch(apiBaseUrl);
                const data = await response.json();
                
                surahSelect.innerHTML = '';
                data.data.forEach(surah => {
                    surahDataMap[surah.number] = surah; 
                    const option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.name.transliteration.id} (${surah.name.short}) - ${surah.numberOfVerses} Ayat`;
                    surahSelect.appendChild(option);
                });

                surahSelect.addEventListener('change', () => {
                    const selectedSurah = surahDataMap[surahSelect.value];
                    if (selectedSurah) {
                        ayatStartInput.value = 1;
                        ayatEndInput.value = selectedSurah.numberOfVerses;
                    }
                });

                if (data.data.length > 0) {
                    surahSelect.value = data.data[0].number;
                    surahSelect.dispatchEvent(new Event('change'));
                }
            } catch (error) {
                surahSelect.innerHTML = '<option value="">Gagal memuat data</option>';
            }
        }
        fetchSurahList();

        btnLoad.addEventListener('click', async () => {
            const surahNumber = surahSelect.value;
            const start = parseInt(ayatStartInput.value);
            const end = parseInt(ayatEndInput.value);
            const includeBismillah = includeBismillahCheckbox.checked;
            const selectedQari = qariSelect.value;

            if (!surahNumber) return alert("Pilih surah terlebih dahulu!");
            if (start > end) return alert("Ayat awal tidak boleh lebih besar dari ayat akhir!");

            btnLoad.disabled = true;
            statusInfo.innerHTML = "Mengambil data teks dari API...";
            
            try {
                // Bersihkan memori audio sebelumnya
                currentAyatData = [];
                currentAudioList.forEach(url => {
                    if(url.startsWith('blob:')) URL.revokeObjectURL(url);
                });
                currentAudioList = [];

                btnLoad.innerHTML = `<span class="animate-pulse">Menghubungkan Server...</span>`;
                const response = await fetch(`${apiBaseUrl}/${surahNumber}`);
                const result = await response.json();
                const surahData = result.data;
                let verses = surahData.verses.filter(v => v.number.inSurah >= start && v.number.inSurah <= end);
                
                let totalItems = verses.length + (includeBismillah && start === 1 && surahData.preBismillah ? 1 : 0);
                let loadedCount = 0;

                // Fungsi canggih untuk mengunduh mp3 ke RAM (Agar saat play/karaoke tidak lag sedetik pun)
                async function fetchAudioBlob(url, ayatObj) {
                    try {
                        const audioRes = await fetch(url);
                        if (!audioRes.ok) throw new Error("Audio Gagal Diunduh");
                        const blob = await audioRes.blob();
                        currentAudioList.push(URL.createObjectURL(blob)); // Simpan mp3 ke RAM
                        currentAyatData.push(ayatObj);
                    } catch (e) {
                        console.warn("Gagal load blob, fallback ke URL asal", url);
                        currentAudioList.push(url); // Fallback ke URL jika diblokir
                        currentAyatData.push(ayatObj);
                    }
                    loadedCount++;
                    btnLoad.innerHTML = `<span class="animate-pulse">Memuat Ayat: ${loadedCount} / ${totalItems}</span>`;
                    statusInfo.innerHTML = `Mempersiapkan audio... ${Math.round((loadedCount/totalItems)*100)}%`;
                }

                // 1. Muat Basmalah
                if (includeBismillah && surahNumber !== "1" && surahNumber !== "9" && start === 1 && surahData.preBismillah) {
                     await fetchAudioBlob(
                         `https://cdn.islamic.network/quran/audio/128/${selectedQari}/1.mp3`,
                         {
                             text: surahData.preBismillah.text.arab,
                             translationId: "Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang.",
                             verseNumber: 0
                         }
                     );
                }

                // 2. Muat Setiap Ayat
                for (let i = 0; i < verses.length; i++) {
                    const v = verses[i];
                    const audioUrl = `https://cdn.islamic.network/quran/audio/128/${selectedQari}/${v.number.inQuran}.mp3`;

                    await fetchAudioBlob(
                         audioUrl,
                         {
                             text: v.text.arab,
                             translationId: v.translation.id,
                             verseNumber: v.number.inSurah
                         }
                    );
                }

                btnLoad.innerHTML = `Menyusun Tampilan...`;
                renderQuranText();
                
                currentPlayingIndex = 0;
                loadAudio(0);
                
                statusInfo.innerHTML = "✅ Data Sukses Dimuat! Putar untuk uji Karaoke, atau langsung Export.";
                tabBtns[1].click(); // Lompat ke Tab Studio

            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan jaringan.");
                statusInfo.innerHTML = "❌ Gagal memuat data.";
            } finally {
                btnLoad.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Muat Data Ayat';
                btnLoad.disabled = false;
            }
        });

        function renderQuranText() {
            if (currentAyatData.length === 0) return;

            emptyState.style.display = 'none';
            quranTextContainer.classList.remove('hidden');
            quranTextContainer.innerHTML = '';

            const surahName = surahDataMap[surahSelect.value]?.name.transliteration.id.toUpperCase() || "SURAH";

            currentAyatData.forEach((ayat, index) => {
                const div = document.createElement('div');
                // Absolute Inset & Transition membuat efek Fade In/Out (Karaoke Visual)
                div.className = `ayat-block absolute inset-0 flex flex-col justify-between py-12 px-6 transition-opacity duration-500 ease-in-out ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`;
                
                const showTranslation = toggleTerjemahan.checked;
                const headerText = ayat.verseNumber === 0 ? `${surahName} • BASMALAH` : `${surahName} • AYAT ${ayat.verseNumber}`;
                const textColor = colorArabInput.value;
                const arabSize = sizeArabInput.value;
                const indoSize = sizeIndoInput.value;

                div.innerHTML = `
                    <div class="text-center w-full mt-4">
                        <h3 class="text-[10px] tracking-[0.25em] text-[#FBBF24] uppercase font-bold drop-shadow-md">${headerText}</h3>
                    </div>
                    
                    <div class="flex-1 flex items-center justify-center w-full">
                        <div class="arabic-text leading-[2.5] text-center font-bold transition-all duration-300" 
                             style="color: ${textColor}; font-size: ${arabSize}px; text-shadow: 0 0 10px ${textColor}80, 0 0 20px ${textColor}40;">
                            ${ayat.text}
                        </div>
                    </div>
                    
                    ${showTranslation ? `
                    <div class="flex flex-col items-center justify-end mb-6 w-full">
                        <div class="translation-text font-sans text-[#FBBF24] font-semibold text-center mb-3 leading-snug px-4 transition-all duration-300" style="font-size: ${indoSize}px;">
                            ${ayat.translationId}
                        </div>
                    </div>
                    ` : ''}
                `;
                quranTextContainer.appendChild(div);
            });
            updateLayout();
        }

        function loadAudio(index) {
            if (index < 0 || index >= currentAudioList.length) return;
            
            audioPlayer.src = currentAudioList[index];
            audioPlayer.load(); 
            currentPlayingIndex = index;
            
            const surahName = surahSelect.options[surahSelect.selectedIndex]?.text.split('(')[0].trim() || "Surah";
            const verseNum = currentAyatData[index].verseNumber;
            nowPlayingText.textContent = verseNum === 0 ? `${surahName} - Basmalah` : `${surahName} - Ayat ${verseNum}`;
            
            // Trigger Efek Karaoke (Ganti tampilan ayat sesuai audio yg aktif)
            highlightAyat(index);
        }

        function highlightAyat(index) {
            document.querySelectorAll('.ayat-block').forEach((block, i) => {
                if (i === index) {
                    block.classList.remove('opacity-0', 'z-0', 'pointer-events-none');
                    block.classList.add('opacity-100', 'z-10');
                } else {
                    block.classList.remove('opacity-100', 'z-10');
                    block.classList.add('opacity-0', 'z-0', 'pointer-events-none');
                }
            });
        }

        function playSafe() {
            if (!audioPlayer.src) return;
            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                }).catch(e => console.warn("Auto-play ditunda", e));
            }
        }

        function togglePlay() {
            if (currentAudioList.length === 0) return alert("Muat data ayat terlebih dahulu!");
            
            if (audioPlayer.paused) {
                playSafe();
            } else {
                audioPlayer.pause();
                iconPause.classList.add('hidden');
                iconPlay.classList.remove('hidden');
            }
        }

        btnPlay.addEventListener('click', togglePlay);
        btnPreviewAudio.addEventListener('click', () => { tabBtns[1].click(); if(audioPlayer.paused) playSafe(); });
        
        btnNext.addEventListener('click', () => { if (currentPlayingIndex < currentAudioList.length - 1) { loadAudio(currentPlayingIndex + 1); playSafe(); } });
        btnPrev.addEventListener('click', () => { if (currentPlayingIndex > 0) { loadAudio(currentPlayingIndex - 1); playSafe(); } });

        // INTI KARAOKE: Saat audio 1 ayat selesai, langsung pindah ke ayat selanjutnya secara otomatis!
        audioPlayer.addEventListener('ended', () => {
            if (currentPlayingIndex < currentAudioList.length - 1) {
                loadAudio(currentPlayingIndex + 1);
                playSafe();
            } else {
                // Semua ayat selesai dibaca
                iconPause.classList.add('hidden');
                iconPlay.classList.remove('hidden');
                
                // Jika sedang Export, saat ayat terakhir habis -> Stop dan Download otomatis!
                if (isExporting) {
                    finishExport();
                }
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            if (!isNaN(duration) && duration > 0) {
                progressBar.style.width = `${(current / duration) * 100}%`;
                timeCurrent.textContent = formatTime(current);
                timeTotal.textContent = formatTime(duration);
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function updateLayout() {
            const posY = posYInput.value;
            overlayContent.style.justifyContent = posY < 33 ? 'flex-start' : posY > 66 ? 'flex-end' : 'center';
            overlayContent.style.paddingTop = posY < 33 ? '10%' : '';
            overlayContent.style.paddingBottom = posY > 66 ? '10%' : '';
        }

        posYInput.addEventListener('input', updateLayout);
        sizeArabInput.addEventListener('input', renderQuranText);
        colorArabInput.addEventListener('input', renderQuranText);
        sizeIndoInput.addEventListener('input', renderQuranText);
        toggleTerjemahan.addEventListener('change', renderQuranText);

        bgGreenBtn.addEventListener('click', () => {
            exportArea.style.backgroundColor = '#00FF00';
            bgGreenBtn.classList.replace('border-transparent', 'border-emerald-500');
            bgBlackBtn.classList.replace('border-gray-600', 'border-transparent');
        });
        
        bgBlackBtn.addEventListener('click', () => {
            exportArea.style.backgroundColor = '#0b0f19';
            bgBlackBtn.classList.replace('border-transparent', 'border-gray-600');
            bgGreenBtn.classList.replace('border-emerald-500', 'border-transparent');
        });

        // Helper memotong teks panjang untuk Kanvas Latar Belakang (Export)
        function wrapText(context, text, x, y, maxWidth, lineHeight, isArabic) {
            const words = text.split(' ');
            let line = '';
            let lines = [];
            
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());
            
            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            context.direction = isArabic ? 'rtl' : 'ltr';
            for(let i = 0; i < lines.length; i++) {
                context.fillText(lines[i], x, startY + (i * lineHeight));
            }
        }

        // Looping untuk menggambar frame video rahasia di latar belakang (Tidak mengubah UI!)
        function startCanvasRecordingLoop() {
            const ctx = recordCanvas.getContext('2d');
            const w = recordCanvas.width;
            const h = recordCanvas.height;

            function draw() {
                if (!isExporting) return;
                
                // 1. Gambar Background Canvas (Hitam/Hijau)
                ctx.fillStyle = bgGreenBtn.classList.contains('border-emerald-500') ? '#00FF00' : '#0b0f19';
                ctx.fillRect(0, 0, w, h);
                
                // 2. Gambar Teks Ayat yang Sedang Aktif
                if (currentAyatData.length > 0 && currentPlayingIndex >= 0) {
                    const ayat = currentAyatData[currentPlayingIndex];
                    const surahName = surahSelect.options[surahSelect.selectedIndex]?.text.split('(')[0].trim() || "Surah";
                    const headerText = ayat.verseNumber === 0 ? `${surahName} • BASMALAH` : `${surahName} • AYAT ${ayat.verseNumber}`;
                    const showTranslation = toggleTerjemahan.checked;
                    
                    const textColor = colorArabInput.value || '#FBBF24';
                    const arabSize = parseInt(sizeArabInput.value) * 2; 
                    const indoSize = parseInt(sizeIndoInput.value) * 2.5;
                    const posY = parseInt(posYInput.value); 
                    const centerY = (posY / 100) * h; 
                    
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Header
                    ctx.fillStyle = '#FBBF24';
                    ctx.font = `bold ${indoSize * 0.8}px 'Inter', sans-serif`;
                    ctx.fillText(headerText.toUpperCase(), w/2, centerY - arabSize - 80);
                    
                    // Arab Glow
                    ctx.fillStyle = textColor;
                    ctx.font = `bold ${arabSize}px 'Amiri Quran', serif`;
                    ctx.shadowColor = textColor + '80';
                    ctx.shadowBlur = 20;
                    wrapText(ctx, ayat.text, w/2, centerY, w * 0.85, arabSize * 2.2, true);
                    ctx.shadowBlur = 0; 
                    
                    // Terjemahan
                    if (showTranslation) {
                        ctx.fillStyle = '#FBBF24';
                        ctx.font = `600 ${indoSize}px 'Inter', sans-serif`;
                        wrapText(ctx, ayat.translationId, w/2, centerY + arabSize + 60, w * 0.85, indoSize * 1.5, false);
                    }
                }
                
                exportAnimationFrame = requestAnimationFrame(draw);
            }
            draw();
        }

        btnExport.addEventListener('click', async () => {
            if (currentAyatData.length === 0) return alert("Muat data ayat terlebih dahulu!");
            
            // Konfirmasi, dan pindahkan tab ke Studio agar user melihat prosesnya
            tabBtns[1].click();

            isExporting = true;
            statusInfo.innerHTML = "🔴 Merekam di Latar Belakang... (Tunggu Audio Selesai)";
            
            // Kunci tombol UI agar tidak diinterupsi
            btnExport.disabled = true;
            btnLoad.disabled = true;
            btnExport.innerHTML = '<span class="animate-pulse">Memproses...</span>';
            recordingIndicator.classList.remove('hidden'); // Tampilkan indikator Merekam di preview

            try {
                // 1. Setup Audio Web API (Untuk memasukkan audio ke dalam video recorder)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                
                if (!sourceNode) {
                    sourceNode = audioCtx.createMediaElementSource(audioPlayer);
                    destNode = audioCtx.createMediaStreamDestination();
                    sourceNode.connect(destNode); // Kirim suara ke recorder
                    sourceNode.connect(audioCtx.destination); // Tetap bunyikan di speaker pengguna
                }

                // 2. Mulai menggambar di kanvas tersembunyi & tangkap gambarnya
                startCanvasRecordingLoop();
                const canvasStream = recordCanvas.captureStream(30);
                
                // Gabungkan Gambar Canvas + Suara Audio API
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...destNode.stream.getAudioTracks()
                ]);

                // Gunakan format Video yang umum (WebM/MP4)
                let mimeType = 'video/webm; codecs=vp9,opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm'; 
                    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4'; 
                }

                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
                recordedChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };

                // 3. FUNGSI AUTO-DOWNLOAD SETELAH SELESAI
                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(recordedChunks, { type: mimeType });
                    const videoUrl = URL.createObjectURL(videoBlob);
                    
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = videoUrl;
                    
                    const surahName = surahSelect.options[surahSelect.selectedIndex]?.text.split('(')[0].trim() || "Surah";
                    a.download = `QuranOverlay_${surahName}_Auto.webm`; // Terdownload otomatis!
                    
                    document.body.appendChild(a);
                    a.click(); 
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(videoUrl);
                    }, 100);

                    // Kembalikan UI seperti semula
                    resetExportUI();
                    statusInfo.innerHTML = "✅ Rekaman Selesai & Video Berhasil Diunduh!";
                };

                // Mulai Merekam (Mesin Perekam berjalan)
                mediaRecorder.start();
                
                // Mulai putar dari Ayat 1. Saat lagu habis, sistem akan otomatis stop recorder (lihat di audioPlayer.onended)
                loadAudio(0);
                playSafe();

            } catch (err) {
                console.error("Gagal export", err);
                alert("Gagal merekam. Izin audio/rekam layar mungkin diblokir browser.");
                resetExportUI();
            }
        });

        // Helper untuk mereset tampilan setelah export selesai/gagal
        function resetExportUI() {
            isExporting = false;
            cancelAnimationFrame(exportAnimationFrame); 
            btnExport.disabled = false;
            btnLoad.disabled = false;
            btnExport.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> Export`;
            recordingIndicator.classList.add('hidden'); // Sembunyikan tulisan "MEREKAM"
        }

        function finishExport() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                // Beri jeda 1 detik di akhir agar suara ayat terakhir tidak terpotong tiba-tiba
                setTimeout(() => mediaRecorder.stop(), 1000); 
            }
        }
    </script>
</body>
