<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qur'an Overlay Studio Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        @font-face {
            font-family: 'Uthmani';
            src: url('https://themes.quran.com/assets/fonts/quran/hafs/uthmanic/UthmanicHafs1-Ver18.woff2') format('woff2');
            font-display: swap;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; overflow: hidden; color: #333;
        }

        .phone-frame {
            width: 100%; max-width: 420px; height: 100dvh;
            background-color: #f0fdf4; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        @media (min-width: 421px) {
            .phone-frame {
                height: 90dvh; border-radius: 2.5rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
                border: 12px solid #10b981;
            }
        }

        #splash-screen {
            position: absolute; inset: 0; background-color: #050b14;
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s; cursor: pointer;
        }
        
        @keyframes floatLogo {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.3)); }
            50% { transform: translateY(-15px); filter: drop-shadow(0 0 35px rgba(16, 185, 129, 0.6)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.3)); }
        }
        .logo-image {
            width: 75%; max-width: 250px;
            animation: floatLogo 4s ease-in-out infinite;
            object-fit: contain; 
        }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .tab-content { display: none; flex: 1; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; }
        
        .bg-pink-transparent { background-color: rgba(236, 72, 153, 0.08); }
        #tab-studio { background-color: #050b14; color: white; padding: 0; position: relative; transition: background-color 0.3s; }
        
        .canvas-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; padding: 2rem; padding-bottom: 5.5rem; overflow-y: auto; width: 100%;
        }

        .font-arabic { font-family: 'Uthmani', serif; line-height: 1.8; }
        .karaoke-wrapper { position: relative; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center;}
        
        .ayat-base { 
            color: #FFD700; 
            width: 100%; 
            transition: color 0.5s ease-in-out; /* Transisi Pudar */
        }

        #custom-alert {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(220, 38, 38, 0.95); color: white; padding: 12px 24px;
            border-radius: 9999px; font-size: 12px; font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }

        #hidden-render-canvas { display: none; }
    </style>
</head>
<body>

    <div id="splash-screen" onclick="hideSplash()">
        <img src="Logo Quran Overlay.png" alt="Quran Overlay" class="logo-image" onerror="this.onerror=null; this.src='https://placehold.co/400x400/050b14/10b981?text=Quran+Overlay'">
        <p class="text-emerald-400 text-xs mt-8 tracking-[0.2em] animate-pulse">KETUK UNTUK MEMULAI</p>
    </div>

    <!-- Resolusi HD (Standar Export Aman) -->
    <canvas id="hidden-render-canvas" width="720" height="1280"></canvas>
    <div id="custom-alert">Pesan Error</div>

    <div class="phone-frame">
        <div class="app-header p-4 flex justify-between items-center bg-white shadow-sm z-10 shrink-0">

                <div>
                    <h1 class="font-bold text-gray-800 leading-tight text-sm">Qur'an Overlay</h1>
                    <p class="text-[10px] text-emerald-500 font-semibold">Mobile Video Studio</p>
                </div>
            </div>
            <button id="btn-export" class="bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow-md flex items-center gap-1 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM133.66,21.66a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,73.66L120,47.31V152a8,8,0,0,0,16,0V47.31l26.34,26.35a8,8,0,0,0,11.32-11.32Z"></path></svg>
                Export
            </button>
        </div>

        <div class="main-content">
            <div id="tab-surah" class="tab-content active p-4 space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50">
                    <h2 class="text-xs font-bold text-emerald-600 mb-3 uppercase">Pilih Surah & Ayat</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[11px] text-gray-500 font-medium mb-1 block">Surah Al-Qur'an</label>
                            <select id="surah-select" class="w-full bg-pink-transparent border border-pink-100 text-gray-700 text-sm rounded-xl focus:ring-emerald-500 p-2.5 outline-none"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[11px] text-gray-500 font-medium mb-1 block">Dari Ayat</label>
                                <input type="number" id="ayat-start" value="1" min="1" class="w-full bg-pink-transparent border border-pink-100 text-gray-700 text-sm rounded-xl p-2.5 outline-none">
                            </div>
                            <div>
                                <label class="text-[11px] text-gray-500 font-medium mb-1 block">Sampai Ayat</label>
                                <input type="number" id="ayat-end" value="7" min="1" class="w-full bg-pink-transparent border border-pink-100 text-gray-700 text-sm rounded-xl p-2.5 outline-none">
                            </div>
                        </div>
                        <div class="flex items-center gap-2 pt-2">
                            <input type="checkbox" id="check-bismillah" checked class="w-4 h-4 text-emerald-500 rounded focus:ring-emerald-500">
                            <label for="check-bismillah" class="text-xs text-gray-600 font-medium">Sertakan Basmalah di awal</label>
                        </div>
                    </div>
                    <button id="btn-load" class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all active:scale-95">
                        Muat Data Ayat
                    </button>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50">
                    <h2 class="text-xs font-bold text-pink-500 mb-3 uppercase">Audio & Qari</h2>
                    <select id="qari-select" class="w-full bg-pink-transparent border border-pink-100 text-gray-700 text-sm rounded-xl p-2.5 outline-none">
                        <option value="ar.alafasy">Mishary Rashid Alafasy</option>
                        <option value="ar.husary">Mahmoud Khalil Al-Husary</option>
                        <option value="ar.abdurrahmaansudais">Abdurrahman As-Sudais</option>
                    </select>
                </div>
            </div>

            <div id="tab-studio" class="tab-content relative">
                <div class="canvas-container">
                    <div id="ui-header" class="text-[#FFD700] text-xs font-bold tracking-widest uppercase mb-10 text-center">NAMA SURAH</div>

                    <div class="karaoke-wrapper px-2 mb-6">
                        <div id="ui-arab-base" class="ayat-base font-arabic text-[2.2rem] leading-loose flex flex-wrap justify-center gap-x-2" dir="rtl"></div>
                    </div>

                    <div id="ui-translation" class="w-[90%] border-t border-gray-700/60 pt-5 mt-6">
                        <p id="ui-indo" class="text-center text-[#FFD700] font-semibold text-sm mb-3"></p>
                        <p id="ui-eng" class="text-center text-slate-300 italic text-xs font-light"></p>
                    </div>
                </div>
                
                <!-- Garis Progres Neon Berada di Sudut Bawah Layar Hitam -->
                <div id="audio-progress" class="absolute bottom-0 left-0 h-1.5 bg-emerald-500 w-0 transition-all duration-100 shadow-[0_0_8px_rgba(16,185,129,0.9)] z-20"></div>
            </div>

            <div id="tab-desain" class="tab-content p-4 space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50">
                    <h2 class="text-xs font-bold text-emerald-600 mb-3 uppercase">Pengaturan Teks & Warna</h2>
                    <div class="mb-4">
                        <label class="text-[11px] text-gray-500 font-medium mb-1 flex justify-between">
                            <span>Ukuran Arab</span><span id="val-size-arab">2.2rem</span>
                        </label>
                        <input type="range" id="size-arab" min="1.5" max="3.5" step="0.1" value="2.2" class="w-full accent-emerald-500">
                    </div>
                    <div class="mb-4">
                        <label class="text-[11px] text-gray-500 font-medium mb-1 flex justify-between">
                            <span>Ukuran Terjemahan</span><span id="val-size-terj">0.875rem</span>
                        </label>
                        <input type="range" id="size-terjemahan" min="0.6" max="1.5" step="0.05" value="0.875" class="w-full accent-emerald-500">
                    </div>
                    <div>
                        <label class="text-[11px] text-gray-500 font-medium mb-1 block">Warna Latar Studio (Gunakan #00FF00 untuk Green Screen)</label>
                        <input type="color" id="color-picker" value="#050b14" class="w-full h-10 p-1 rounded border-2 border-emerald-500 cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <div id="loading-overlay" class="absolute inset-0 bg-gray-900/95 z-40 hidden flex-col justify-center items-center text-white">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-500 border-t-transparent mb-4"></div>
            <p id="loading-text" class="font-semibold text-sm text-center px-4">Memproses...</p>
        </div>

        <div id="export-modal" class="absolute inset-0 bg-gray-900/98 z-50 hidden flex-col justify-center items-center text-white">

            <h2 class="text-lg font-bold text-white mb-2">Merender Video...</h2>

            </div>
            <p class="text-[10px] text-gray-500 mt-4 text-center px-6">Mohon jangan tutup browser selama proses berjalan.</p>
        </div>

                <span class="text-[9px] font-bold">Desain</span>
            </button>
        </div>
    </div>

    <audio id="main-audio" crossorigin="anonymous"></audio>

    function showMessage(msg, type = 'error') {
        const alertBox = document.getElementById('custom-alert');
        alertBox.innerText = msg;
        alertBox.style.background = type === 'error' ? 'rgba(220, 38, 38, 0.95)' : 'rgba(16, 185, 129, 0.95)';
        alertBox.classList.add('show');
        setTimeout(() => alertBox.classList.remove('show'), 3500);

        // Fungsi Ambil Teks Berlapis (Anti Blokir Jaringan HP Provider Seluler)
        async function fetchJsonSafely(url) {
            const targets = [
                url,
                `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
            ];
            for (let u of targets) {
                try {
                    const res = await fetch(u, { mode: 'cors', cache: 'no-store' });
                    if (res.ok) return await res.json();
                } catch (e) { /* Coba jalur alternatif berikutnya */ }
            }
            throw new Error("Gagal terhubung ke server Al-Qur'an.");
        }

        // Fungsi Sedot Audio Berlapis (Dual CDN + Proxy Fallback)
        async function getAudioBufferSafely(candidates) {
            const list = Array.isArray(candidates) ? candidates : [candidates];
            const testUrls = [...list];
            
            // Tambahkan proxy penyelamat jika server langsung dibatasi
            if (list[0]) {
                testUrls.push(`https://corsproxy.io/?url=${encodeURIComponent(list[0])}`);
                testUrls.push(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(list[0])}`);
            }

            for (let u of testUrls) {
                try {
                    const res = await fetch(u, { mode: 'cors', cache: 'no-store' });
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        if (buffer.byteLength > 2000) return buffer;
                    }
                } catch(e) { /* Lanjut ke kandidat berikutnya */ }
            }

            throw new Error("Gagal menyedot audio. Sinyal HP tidak stabil.");

        try {

                try {
                    const eqData = await fetchJsonSafely(`https://equran.id/api/v2/surat/${surahNum}`);
                    if (eqData && eqData.data && eqData.data.ayat) {
                        dataArabAyahs = eqData.data.ayat.map(a => ({ text: a.teksArab }));
                        dataIndoAyahs = eqData.data.ayat.map(a => ({ text: a.teksIndonesia }));
                    }
                } catch(eEq) {
                    // TAHAP 3: JALUR CADANGAN RESMI QURAN.COM CLOUDFLARE
                    const qcomData = await fetchJsonSafely(`https://api.quran.com/api/v4/verses/by_chapter/${surahNum}?translations=33,20&fields=text_uthmani&per_page=300`);
                    if (qcomData && qcomData.verses) {

                        dataIndoAyahs = qcomData.verses.map(v => ({ text: (v.translations && v.translations[0]) ? v.translations[0].text.replace(/<[^>]*>/g, '') : '' }));
                        engAyahs = qcomData.verses.map(v => ({ text: (v.translations && v.translations[1]) ? v.translations[1].text.replace(/<[^>]*>/g, '') : '' }));
                    }
                }
            }

            if (!dataArabAyahs || dataArabAyahs.length === 0) {
                throw new Error("Gagal memuat teks surah. Silakan periksa koneksi data.");
            }

            const surahName = surahListMap[surahNum].name;
            const bismillahUthmani = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

            if (withBismillah && surahNum !== 1 && surahNum !== 9 && start === 1) {
                document.getElementById('loading-text').innerText = `Menyedot Audio Basmalah...`;
                const bismillahCandidates = [
                    `https://verses.quran.com/${qcQari}/mp3/001001.mp3`,
                    `https://everyayah.com/data/${eQari}/001001.mp3`
                ];
                const bBuffer = await getAudioBufferSafely(bismillahCandidates);
                const bBlobUrl = URL.createObjectURL(new Blob([bBuffer], { type: 'audio/mpeg' }));
                
                currentAyatData.push({
                    title: `${surahName} • BASMALAH`,
                    arab: bismillahUthmani,
                    indo: "Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang.",
                    eng: "In the name of Allah, the Entirely Merciful, the Especially Merciful.",

                    rawArrayBuffer: bBuffer 
                });

            for (let i = start; i <= end; i++) {

                let textArab = (dataArabAyahs[i-1] && dataArabAyahs[i-1].text) ? dataArabAyahs[i-1].text : "";
                if (i === 1 && surahNum !== 1 && surahNum !== 9) {
                    textArab = textArab.replace(bismillahUthmani, "").replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", "").replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, "").trim();
                }

                const surahFormat = surahNum.toString().padStart(3, '0');
                const ayahFormat = i.toString().padStart(3, '0');
                
                const ayahCandidates = [
                    `https://verses.quran.com/${qcQari}/mp3/${surahFormat}${ayahFormat}.mp3`,
                    `https://everyayah.com/data/${eQari}/${surahFormat}${ayahFormat}.mp3`
                ];
                
                const aBuffer = await getAudioBufferSafely(ayahCandidates);
                const aBlobUrl = URL.createObjectURL(new Blob([aBuffer], { type: 'audio/mpeg' }));

                currentAyatData.push({
                    title: `${surahName} • AYAT ${i}`,
                    arab: textArab,
                    indo: (dataIndoAyahs[i-1] && dataIndoAyahs[i-1].text) ? dataIndoAyahs[i-1].text : "",
                    eng: (engAyahs && engAyahs[i-1] && engAyahs[i-1].text) ? engAyahs[i-1].text : "",

            loadingOverlay.classList.add('hidden'); loadingOverlay.classList.remove('flex');
            
            if (currentAyatData.length > 0) {

        } catch (err) {

            showMessage(`Gagal: ${err.message}`, "error");

    function updateKaraokeVisual() {

            const progress = audioPlayer.currentTime / audioPlayer.duration;
            const spans = arabBase.getElementsByTagName('span');
            const totalWords = spans.length;
            const activeIdx = Math.floor(progress * totalWords);
            
            for (let i = 0; i < totalWords; i++) {
                if (i <= activeIdx) {

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;
        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line.trim(), x, currentY);
                line = words[n] + ' '; currentY += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line.trim(), x, currentY); return currentY;
    }

    function drawKaraokeCanvas(ctx, text, x, startY, maxWidth, lineHeight, progress, exportCurrentTime) {
        const words = text.split(' ');
        let lines = []; let currentLine = ''; let lineWordCounts = []; let wordCount = 0;

        for(let n = 0; n < words.length; n++) {
            let testLine = currentLine + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                lines.push(currentLine.trim()); lineWordCounts.push(wordCount);
                currentLine = words[n] + ' '; wordCount = 1; 
            } else {
                currentLine = testLine; wordCount++;
            }
        }
        lines.push(currentLine.trim()); lineWordCounts.push(wordCount);

        const totalLines = lines.length;
        const totalWords = words.length;
        const targetWordCount = progress * totalWords; 

        let currentLineIdx = 0; let wordsPassed = 0; let lineProg = 0;

        // Hitung proporsi baris secara presisi
        for (let i = 0; i < totalLines; i++) {
            if (targetWordCount <= wordsPassed + lineWordCounts[i] || i === totalLines - 1) {
                currentLineIdx = i;
                let wordsInThisLine = lineWordCounts[i];
                let wordProgressInThisLine = targetWordCount - wordsPassed;
                lineProg = Math.max(0, Math.min(1, wordProgressInThisLine / wordsInThisLine));
                break;
            }
            wordsPassed += lineWordCounts[i];
        }

        if (progress >= 1) { currentLineIdx = totalLines - 1; lineProg = 1; }

        // Cinematic Dimming pada Export: Kuning meredup
        ctx.fillStyle = exportCurrentTime > 0.05 ? "rgba(255, 215, 0, 0.15)" : "#FFD700";
        ctx.shadowBlur = 0;
        let cy = startY;
        lines.forEach(line => { ctx.fillText(line, x, cy); cy += lineHeight; });
        const bottomY = cy - lineHeight;

        if (progress > 0 && exportCurrentTime > 0.05) {
            ctx.save(); ctx.beginPath();
            
            // Pangkas topeng hijau tepat seukuran tinggi 1 baris agar tidak bocor
            let clipY = startY - (lineHeight * 0.8);

            for (let i = 0; i < totalLines; i++) {
                if (i < currentLineIdx) {
                    ctx.rect(0, clipY, ctx.canvas.width, lineHeight); // Baris lewat dibuka full
                } else if (i === currentLineIdx) {
                    const revealWidth = ctx.canvas.width * lineProg;
                    const startX = ctx.canvas.width - revealWidth;
                    ctx.rect(startX, clipY, revealWidth, lineHeight); // Baris aktif disapu
                }
                clipY += lineHeight;
            }
            ctx.clip(); 

            ctx.fillStyle = "#10b981";
            ctx.shadowColor = "rgba(16, 185, 129, 0.8)"; ctx.shadowBlur = 15;
            let cy2 = startY;
            lines.forEach(line => { ctx.fillText(line, x, cy2); cy2 += lineHeight; });
            ctx.restore();
        }
        return bottomY;
    }

    document.getElementById('btn-export').addEventListener('click', async () => {
        if (currentAyatData.length === 0) return showMessage("Muat ayat terlebih dahulu!");
        
        stopAudio(); isExporting = true;
        
        const modal = document.getElementById('export-modal');
        const progressStatus = document.getElementById('export-status');
        const progressBar = document.getElementById('export-progress-bar');
        modal.classList.remove('hidden'); modal.classList.add('flex');
        
        const canvas = document.getElementById('hidden-render-canvas');
        const ctx = canvas.getContext('2d');
        const bgColor = document.getElementById('color-picker').value;
        
        // Pancingan Kanvas Anti-Error HP
        ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // KUNCI PEMBOBOL AUDIO (Wajib di awal untuk HP Safari/Android)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const unlockSource = audioCtx.createBufferSource();
        unlockSource.buffer = audioCtx.createBuffer(1, 1, 22050); 
        unlockSource.connect(audioCtx.destination); unlockSource.start(0);
        if (audioCtx.state === 'suspended') await audioCtx.resume(); 

        const audioDest = audioCtx.createMediaStreamDestination();
        const silence = audioCtx.createOscillator();
        const silenceGain = audioCtx.createGain();
        silenceGain.gain.value = 0; silence.connect(silenceGain);
        silenceGain.connect(audioDest); silence.start();

        try {
            // TAHAP 1: PRE-FETCH RAM (MENCEGAH JEDA 15 DETIK)
            progressStatus.innerText = "Tahap 1: Memproses Audio (Harap Tunggu)...";
            for(let i=0; i<currentAyatData.length; i++) {
                progressBar.style.width = (((i+1) / currentAyatData.length) * 50) + '%'; 
                progressStatus.innerText = `Menyiapkan Memori Ayat ${i+1} / ${currentAyatData.length}...`;
                
                // Audio sudah di-download saat "Muat Data"! Kita tinggal memakainya tanpa butuh internet.
                const buffer = currentAyatData[i].rawArrayBuffer;
                if (!buffer) {
                    throw new Error(`Data audio ayat ${i+1} kosong. Silakan klik Muat Data ulang.`);
                }
                
                // Salin buffer agar tidak terhapus saat di-decode
                const bufferCopy = buffer.slice(0);
                currentAyatData[i].preloadedAudioBuffer = await audioCtx.decodeAudioData(bufferCopy); 
                
                await new Promise(r => setTimeout(r, 50)); 
            }

            // TAHAP 2: RENDER MULUS 0-DETIK JEDA
            progressStatus.innerText = "Tahap 2: Merekam Video Tanpa Jeda...";
            
            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);

            let mimeType = 'video/webm;codecs=vp8,opus'; 
            if(!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm'; 

            const recorderOptions = { mimeType: mimeType, videoBitsPerSecond: 2500000 }; 
            const recorder = new MediaRecorder(combinedStream, recorderOptions);
            let chunks = [];
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.start(200); 

            let isDrawing = true;
            let exportCurrentTime = 0;
            let exportDuration = 0;
            let totalVideoDuration = 0; 

            function drawCanvasFrame() {
                if(!isDrawing) return;
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const ayat = currentAyatData[currentAyatIndex];
                if(ayat) {
                    // Judul Surah diturunkan ke posisi tengah yang seimbang
                    ctx.fillStyle = "#FFD700";
                    ctx.font = "bold 24px Inter"; ctx.textAlign = "center";
                    ctx.fillText(ayat.title, canvas.width/2, 380);
                    
                    // Naskah Arab diletakkan di titik tengah vertikal kanvas (y=490)
                    ctx.font = "52px Uthmani"; ctx.textAlign = "center"; ctx.direction = "rtl";
                    const maxTextWidth = canvas.width - 80; 
                    
                    let progress = 0;
                    if(exportDuration > 0) progress = Math.min(exportCurrentTime / exportDuration, 1);
                    
                    const bottomY = drawKaraokeCanvas(ctx, ayat.arab, canvas.width/2, 490, maxTextWidth, 95, progress, exportCurrentTime);
                    
                    // Terjemahan Bahasa Indonesia diturunkan agar tidak mepet
                    ctx.direction = "ltr";
                    let terjY = bottomY + 95;
                    ctx.fillStyle = "#FFD700"; ctx.font = "600 22px Inter"; ctx.shadowBlur = 0;
                    terjY = wrapCanvasText(ctx, ayat.indo, canvas.width/2, terjY, maxTextWidth, 36);
                    
                    // Terjemahan Bahasa Inggris di bawahnya dengan warna terang elegan
                    if (ayat.eng && ayat.eng.trim() !== '') {
                        ctx.fillStyle = "#cbd5e1";
                        ctx.font = "italic 19px Inter";
                        wrapCanvasText(ctx, ayat.eng, canvas.width/2, terjY + 45, maxTextWidth, 30);
                    }
                }
                if(isDrawing) requestAnimationFrame(drawCanvasFrame);
            }
            drawCanvasFrame(); 
            
            // Putar audio secara estafet langsung dari RAM (Tanpa Jeda)
            for(let i=0; i<currentAyatData.length; i++) {
                currentAyatIndex = i;
                progressStatus.innerText = `Merekam Ayat ${i+1} / ${currentAyatData.length}`;
                progressBar.style.width = (50 + (((i+1) / currentAyatData.length) * 50)) + '%';
                
                const audioBuffer = currentAyatData[i].preloadedAudioBuffer;
                exportDuration = audioBuffer.duration;
                totalVideoDuration += exportDuration; 
                
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioDest);            
                source.start(0); 
                
                const startTime = audioCtx.currentTime;
                
                await new Promise((resolve) => {
                    const progressInterval = setInterval(() => {
                        exportCurrentTime = audioCtx.currentTime - startTime;
                        
                        // Hormati durasi utuh 100%, hindari overlap
                        if (exportCurrentTime >= exportDuration) {
                            clearInterval(progressInterval);
                            source.stop(); // Pengereman presisi
                            resolve(); 
                        }
                    }, 20); 
                });
            }
            
            isDrawing = false;
            await new Promise(r => setTimeout(r, 1000)); // Gaung sisa penutup 1 detik
            totalVideoDuration += 1; 
            recorder.stop();
            if (audioCtx.state !== 'closed') audioCtx.close();
            for(let i=0; i<currentAyatData.length; i++) delete currentAyatData[i].preloadedAudioBuffer;
            
            // Simpan Video WebM + Metadata Fix CapCut
            recorder.onstop = () => {
                progressStatus.innerText = "Menyelaraskan Metadata untuk CapCut...";
                const rawBlob = new Blob(chunks, { type: mimeType }); 
                
                const doDownload = (finalBlob) => {
                    const finalUrl = URL.createObjectURL(finalBlob);
                    const a = document.createElement('a'); a.style.display = 'none';
                    a.href = finalUrl; a.download = `Quran_Overlay_Video.webm`;
                    document.body.appendChild(a); a.click();
                    
                    setTimeout(() => {
                        URL.revokeObjectURL(finalUrl); document.body.removeChild(a);
                        modal.classList.add('hidden'); modal.classList.remove('flex');
                        isExporting = false; currentAyatIndex = 0; renderAyatToScreen(0); 
                        showMessage(`Video siap! Buka di Google Chrome atau langsung ke CapCut.`, "success");
                    }, 1500);
                };

                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.js";
                script.onload = () => { ysFixWebmDuration(rawBlob, totalVideoDuration * 1000, function(fb) { doDownload(fb); }); };
                script.onerror = () => { doDownload(rawBlob); };
                document.body.appendChild(script);
            };

        } catch (err) {
            console.error(err);
            isDrawing = false;
            modal.classList.add('hidden'); modal.classList.remove('flex');
            isExporting = false;
            if (audioCtx.state !== 'closed') audioCtx.close();
            showMessage(`Batal: ${err.message}`, "error");
        }
    });
</script>
</body>
</html>
